schema_version = 1
config_source = "config.toml"
config_keys = ["model", "features.hooks"]
allowed_tokens = ["WORKSPACE_ROOT", "HOME", "LLM_WIKI_ROOT", "CODEX_HOME"]

[config_overrides]
approval_policy = "on-request"
analytics_enabled = false
max_depth = 3

[[requirements]]
name = "zsh"
executable = "/bin/sh"
arguments = ["-c"]
capability = "oracle"

[[requirements]]
name = "bash"
executable = "/bin/sh"
arguments = []

[[files]]
source = "rules/default.rules"
target = "rules/default.rules"
mode = "0644"

[[files]]
source = "hooks/safety.sh"
target = "hooks/safety.sh"
mode = "0755"
capability = "oracle"

[[files.replacements]]
search = "/Users/dongminyu/.codex"
replacement = "${CODEX_HOME}"
expected_matches = 1

[[files]]
source = "agents/advisor.toml"
target = "agents/advisor.toml"
mode = "0644"

[[hooks]]
event = "PreToolUse"
matcher = "Bash"
source_command = "/Users/dongminyu/.codex/hooks/safety.sh"
rendered_command = "${CODEX_HOME}/hooks/safety.sh"
timeout = 5
required_script = "hooks/safety.sh"
capability = "oracle"

[[capabilities]]
name = "oracle"
required_tokens = ["LLM_WIKI_ROOT", "CODEX_HOME"]
read_only = true
instruction_sections = ["Consult the Oracle", "Capability Requirements"]

[forbidden]
literals = ["/Users/dongminyu", "/Volumes/dongminyu"]
path_segments = ["auth\\u002Ejson", "sessions", "logs"]
pattern_ids = ["private-key", "github-token"]
