model = "gpt-5.6-terra"
model_reasoning_effort = "high"
personality = "pragmatic"
service_tier = "default"
notify = ["/Users/dongminyu/.codex/bin/notify", "turn-ended"]

[agents]
max_depth = 2

[agents.advisor]
config_file = "./agents/advisor.toml"

[agents.legacy]
config_file = "./agents/legacy.toml"

[apps.example.tools."approve"]
