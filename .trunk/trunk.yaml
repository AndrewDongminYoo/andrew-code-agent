version: 0.1
cli:
  version: 1.25.0
runtimes:
  enabled:
    - node@24.19.0
lint:
  enabled:
    - prettier@3.6.2
    - markdownlint@0.45.0
    - gitleaks@8.8.7
    - osv-scanner@SYSTEM
  ignore:
    - linters: [prettier]
      paths:
        - "test/**/*.mjs"
    - linters: [markdownlint]
      paths:
        - "AGENTS.md"
