name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # macOS is not a preference: resolveRuntimePaths throws UNSUPPORTED_PLATFORM
  # off darwin, and every layer above the unit tests spawns the real CLI.
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # test:integration, test:contract and test:e2e each exit 0 over a missing
      # or empty directory, so the aggregate gate can go green having run
      # nothing. Fail here instead of reporting that as a pass.
      - name: Assert every test layer contributes files
        run: |
          status=0
          for layer in unit integration contract e2e; do
            count=$(find "test/$layer" -type f -name '*.test.mjs' 2>/dev/null | wc -l | tr -d ' ')
            echo "test/$layer: $count file(s)"
            [ "$count" -gt 0 ] || { echo "::error::test/$layer contributes no test files"; status=1; }
          done
          exit $status

      # typecheck, then build and all four test layers.
      - run: pnpm check

  # Hosted CI does not set the pinned-binary, live-manifest, real-smoke, cache-boundary-smoke, or Oracle-boundary inputs.
  # Those opt-in checks skip.
  lint:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: trunk-io/trunk-action@e1234e67a86010d61ddac8d8ebf4b783e2ffd2fa # v2.0.0
